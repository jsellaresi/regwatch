[project]
name = "regwatch"
version = "0.1.0"
description = "RegWatch — Intelligent Compliance Analysis Platform"
requires-python = ">=3.12"
dependencies = [
    "langchain",
    "langgraph",
    "langgraph-checkpoint-postgres",
    "langchain-anthropic",
    "langchain-openai",
    "langchain-cohere",
    "langchain-community",
    "langchain-text-splitters",
    "sentence-transformers",
    "langfuse",
    "psycopg2-binary",
    "psycopg[binary,pool]",
    "pgvector",
    "pymupdf",
    "pdfplumber",
    "rank-bm25",
    "fastapi",
    "uvicorn[standard]",
    "sse-starlette",
    "pydantic",
    "python-dotenv",
    "python-multipart",
    "sqlalchemy",
    "requests",
]

# Development dependencies (installed by `uv sync`, skipped with `uv sync --no-dev`)
[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

# Optional console commands: `uv run regwatch-ingest`, etc.
[project.scripts]
regwatch-ingest = "scripts.ingest_regulations:main"
regwatch-register-prompts = "scripts.register_prompts:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Flat layout: loose modules at the root + automatically discovered packages.
# Declaring the build-system makes the project installable, so `uv sync` installs it in
# editable mode and `from graph.nodes import ...` resolves from anywhere (tests, scripts, Docker).
[tool.setuptools]
py-modules = ["config", "retriever", "cache_invalidation", "db", "document_store"]

[tool.setuptools.packages.find]
include = ["graph*", "tools*", "observability*", "evals*", "scripts*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
