<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RegWatch</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      :root {
        --bg: #080F1A;
        --surface: #0F1B2D;
        --border: #1C2D44;
        --accent: #3B7DFF;
        --accent-dim: #1A3A6E;
        --text-primary: #DCE6F5;
        --text-secondary: #5F7898;
        --risk-high: #E0404A;
        --risk-medium: #D4892A;
        --risk-low: #25B87A;
        --done: #25B87A;
      }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text-primary);
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #app { height: 100%; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
