name: App Health Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  health-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: regwatch
          POSTGRES_PASSWORD: regwatch
          POSTGRES_DB: regwatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U regwatch -d regwatch_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REGWATCH_TEST_DATABASE_URL: "postgresql://regwatch:regwatch@localhost:5432/regwatch_test"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_placeholder_unused"
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Run unit tests
        run: uv run pytest tests -v --tb=short
