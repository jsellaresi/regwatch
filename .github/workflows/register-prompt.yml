name: Register Prompt (staging)

# Manual only. Registers the current prompt text as a new Langfuse version labelled
# `staging` (the very first registration in an environment also gets `production`).
# Run it from main after changing scripts/register_prompts.py, before the eval gate.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  register:
    # Writes to the owner's Langfuse project: owner only, with the secrets of the
    # `evals` environment (restricted to the main branch).
    if: github.actor == github.repository_owner
    environment: evals
    runs-on: ubuntu-latest
    env:
      # validate_required() only checks these are present; registering a prompt
      # talks to Langfuse alone (no Anthropic, OpenAI or database call).
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DATABASE_URL: "postgresql://regwatch:regwatch@localhost:5432/regwatch"
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Register the prompt
        run: uv run python -m scripts.register_prompts
